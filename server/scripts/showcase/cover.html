<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><style>
html,body{margin:0;width:1400px;height:1400px;overflow:hidden;background:#20333a}
svg{display:block}
</style></head><body>
<!-- 《雾港来信》 cover: a lighthouse on a rock in fog, its beam crossing the sea; flat shapes only -->
<svg width="1400" height="1400" viewBox="0 0 1400 1400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="1400" fill="#22363d"/>
  <!-- fog bands -->
  <rect y="0" width="1400" height="520" fill="#2b4249"/>
  <rect y="520" width="1400" height="120" fill="#304a51"/>
  <rect y="640" width="1400" height="90" fill="#36525a"/>
  <!-- the beam -->
  <polygon points="905,560 0,380 0,700" fill="#e9b25a" opacity="0.22"/>
  <polygon points="905,560 0,470 0,610" fill="#f3c97e" opacity="0.35"/>
  <!-- distant islands -->
  <path d="M0 760 L120 712 L260 738 L380 700 L520 748 L520 800 L0 800 Z" fill="#2a4148"/>
  <path d="M1040 780 L1150 730 L1290 752 L1400 720 L1400 800 L1040 800 Z" fill="#2a4148"/>
  <!-- sea -->
  <rect y="790" width="1400" height="610" fill="#1a2b31"/>
  <g fill="#2a434a">
    <rect x="120" y="860" width="260" height="6"/><rect x="520" y="900" width="180" height="6"/>
    <rect x="980" y="880" width="300" height="6"/><rect x="60" y="980" width="200" height="6"/>
    <rect x="760" y="1010" width="240" height="6"/><rect x="1120" y="1060" width="180" height="6"/>
  </g>
  <!-- beam reflection on water -->
  <g fill="#e9b25a" opacity="0.5">
    <rect x="300" y="920" width="420" height="5"/><rect x="380" y="950" width="300" height="5"/><rect x="450" y="985" width="220" height="5"/>
  </g>
  <!-- rock -->
  <path d="M760 820 L820 760 L1010 750 L1080 800 L1120 850 L700 850 Z" fill="#111d21"/>
  <!-- lighthouse tower -->
  <polygon points="868,760 942,760 930,610 880,610" fill="#ece7dc"/>
  <rect x="876" y="660" width="58" height="22" fill="#b5483b"/>
  <rect x="872" y="716" width="66" height="22" fill="#b5483b"/>
  <rect x="870" y="596" width="70" height="16" fill="#111d21"/>
  <rect x="882" y="548" width="46" height="48" fill="#f3c97e"/>
  <rect x="878" y="540" width="54" height="10" fill="#111d21"/>
  <polygon points="876,540 934,540 905,512" fill="#111d21"/>
  <!-- glow -->
  <circle cx="905" cy="572" r="60" fill="#f3c97e" opacity="0.18"/>
  <!-- envelope in the sky, small, like a seal -->
  <g transform="translate(230 250)">
    <rect width="150" height="100" fill="#ece7dc"/>
    <polygon points="0,0 75,58 150,0" fill="#d9d2c3"/>
    <circle cx="75" cy="60" r="16" fill="#b5483b"/>
  </g>
  <!-- title block -->
  <text x="700" y="1170" text-anchor="middle" font-family="Noto Serif CJK SC, Noto Serif SC, Source Han Serif SC, serif" font-weight="700" font-size="168" fill="#ece7dc" letter-spacing="24">雾港来信</text>
  <text x="700" y="1270" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="44" fill="#e9b25a" letter-spacing="12">沈知秋 著</text>
</svg>
</body></html>
